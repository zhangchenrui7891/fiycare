name: Windows Assimp-enabled source build
on:
  push:
    branches: ['codex/v0.49-asset-lengths']
    paths: ['maintenance/v0.49-asset-lengths/**', '.github/workflows/windows-assimp-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  importer-build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Restore exact dependency, compile with Assimp and run import fixtures
        shell: pwsh
        run: |
          & ./maintenance/v0.49-asset-lengths/tools/check_windows_importer.ps1
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-assimp-build-evidence
          path: |
            maintenance/v0.49-asset-lengths/out/build/windows-importer-check/windows-importer-check.log
            maintenance/v0.49-asset-lengths/out/build/windows-importer-check/Testing/Temporary/LastTest.log
          if-no-files-found: warn
