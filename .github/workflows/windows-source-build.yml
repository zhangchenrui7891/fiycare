name: Windows application source build
on:
  push:
    branches: ['codex/v0.47-autopilot-feedback']
    paths: ['maintenance/v0.47-autopilot-feedback/**', '.github/workflows/windows-source-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Compile full application and check actual HLSL and launch modules
        shell: pwsh
        run: |
          & ./maintenance/v0.47-autopilot-feedback/tools/check_windows_source.ps1
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-source-build-evidence
          path: |
            maintenance/v0.47-autopilot-feedback/out/build/windows-source-check/windows-source-check.log
            maintenance/v0.47-autopilot-feedback/out/build/windows-source-check/Testing/Temporary/LastTest.log
          if-no-files-found: warn
